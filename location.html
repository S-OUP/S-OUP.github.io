	<style>
		*{
			font-family: Roboto Slab;
			box-sizing: border-box;

		.bar{
			background-color: rgb(160, 195, 35 );
			padding: 20px 30px;
			transition: 0.3s;
            display: inline-block;

		.bar:hover{

		.nav{
			position: sticky;

            padding: 0px 20px;

            border-bottom: 1px solid black;
            justify-content: space-evenly;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            z-index: 1000;
        }
		.nav a{
			font-size: 18px;
			text-decoration: none;
			color:darkslategray;
		}
		.dropdown {
            position: relative;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            min-width: 166px;
            background-color: rgb(160, 195, 35 );
            z-index: 1000;
        }


        .dropdown:hover .dropdown-content {
            display: block;
            border-top: 1px solid black;
        }


        .dropdown-content a {
            display: block;
            padding: 12px 15px;
            font-size: 15px;
            border-bottom: 1px solid black;
        }


        .dropdown-content a:hover {
            background-color:rgb(200, 120, 75 );
            
        }
		body{

		}

		.row {

            color: black;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            padding: 10px 20px;
}
